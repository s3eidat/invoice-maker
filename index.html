<meta property="og:description" content="Clean invoices with tax, discounts and your logo. Print or save as PDF. Runs 100% in your browser.">

<script type="application/ld+json">{"@context": "https://schema.org", "@type": "WebApplication", "name": "Invoice Maker", "url": "https://s3eidat.github.io/invoice-maker/", "description": "Clean invoices you can print or save as PDF. Free, private and runs 100% in your browser: no sign-up, no uploads.", "applicationCategory": "UtilitiesApplication", "operatingSystem": "Any (web browser)", "isAccessibleForFree": true, "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"}, "image": "https://s3eidat.github.io/invoice-maker/screenshot.png", "author": {"@type": "Person", "name": "s3eidat", "url": "https://github.com/s3eidat"}}</script>
<!--/s3:seo-->
</head>
<body data-tool="invoice-maker">
<main class="s3-main">
  <section class="s3-hero">
    <h1>Invoice Maker</h1>
    <p>Fill in the form, watch the A4 invoice update, then print it or save it as a PDF. Every invoice is saved in this browser only.</p>
    <div class="s3-badges"><span class="chip accent"><svg class="i"><use href="#i-lock"/></svg>Saved locally, never uploaded</span><span class="chip">Tax &amp; discount per line</span><span class="chip">Any currency</span></div>
  </section>

  <section class="card inv-bar no-print">
    <div class="row">
      <label class="field grow inv-pick">Saved invoices
        <select class="select" id="pick"></select>
      </label>
      <div class="row">
        <button class="btn small" id="new"><svg class="i"><use href="#i-plus"/></svg>New</button>
        <button class="btn small" id="dup"><svg class="i"><use href="#i-copy"/></svg>Duplicate</button>
        <button class="btn small danger" id="del"><svg class="i"><use href="#i-trash"/></svg>Delete</button>
        <label class="btn small ghost" id="imp"><svg class="i"><use href="#i-upload"/></svg>Import<input type="file" accept=".json,application/json" hidden></label>
        <button class="btn small ghost" id="exp"><svg class="i"><use href="#i-download"/></svg>Export</button>
        <button class="btn small primary" id="print"><svg class="i"><use href="#i-file"/></svg>Print / PDF</button>
      </div>
    </div>
  </section>

  <div class="inv-layout mt">
    <section class="card inv-editor no-print" id="editor">
      <h2>Invoice</h2>
      <div class="grid-2">
        <label class="field">Invoice number<input class="input" data-k="number" maxlength="40"></label>
        <label class="field">Currency<select class="select" data-k="currency" id="currency"></select></label>
        <label class="field">Issue date<input class="input" type="date" data-k="date"></label>
        <label class="field">Due date<input class="input" type="date" data-k="due"></label>
      </div>
      <div class="row mt">
        <label class="check"><input type="checkbox" data-k="paid"> Mark as paid</label>
        <span class="grow"></span>
        <label class="check">Accent <input type="color" data-k="accent" aria-label="Accent colour"></label>
      </div>

      <h2 class="mt">From</h2>
      <div class="logo-row">
        <div class="drop logo-drop" id="logoDrop" aria-label="Upload logo"><input type="file" hidden><img id="logoImg" alt="" hidden><span id="logoHint"><svg class="i"><use href="#i-image"/></svg><b>Logo</b><span class="faint">PNG / JPG</span></span></div>
        <div class="stack grow">
          <label class="field">Business name<input class="input" data-k="from.name" dir="auto" maxlength="120"></label>
          <button class="btn ghost small" id="logoRm" hidden>Remove logo</button>
        </div>
      </div>
      <div class="grid-2 mt">
        <label class="field">Email<input class="input" data-k="from.email" dir="auto" maxlength="120"></label>
        <label class="field">Phone<input class="input" data-k="from.phone" dir="auto" maxlength="60"></label>
        <label class="field">Address<textarea class="textarea prose" data-k="from.address" dir="auto" rows="3" maxlength="400"></textarea></label>
        <label class="field">Tax / VAT ID<input class="input" data-k="from.taxId" dir="auto" maxlength="60"></label>
      </div>

      <h2 class="mt">Bill to</h2>
      <div class="grid-2">
        <label class="field">Client name<input class="input" data-k="to.name" dir="auto" maxlength="120"></label>
        <label class="field">Client email<input class="input" data-k="to.email" dir="auto" maxlength="120"></label>
      </div>
      <label class="field mt">Client address<textarea class="textarea prose" data-k="to.address" dir="auto" rows="2" maxlength="400"></textarea></label>

      <div class="row between mt"><h2>Items</h2><button class="btn small" id="addItem"><svg class="i"><use href="#i-plus"/></svg>Add item</button></div>
      <div class="items" id="items"></div>

      <h2 class="mt">Notes &amp; terms</h2>
      <label class="field">Notes<textarea class="textarea prose" data-k="notes" dir="auto" rows="2" maxlength="4000" placeholder="Thank you for your business!"></textarea></label>
      <label class="field mt">Payment terms<textarea class="textarea prose" data-k="terms" dir="auto" rows="2" maxlength="4000" placeholder="Bank transfer to IBAN … within 14 days."></textarea></label>
    </section>

    <section class="paper-wrap" aria-label="Invoice preview">
      <div class="paper" id="paper"></div>
      <div class="stats mt no-print" id="stats"></div>
    </section>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
